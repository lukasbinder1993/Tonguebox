<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Tonguebox – Sprich mit deinen Augen</title>

<style>

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    padding: 12px;
    font-family: Arial, Helvetica, sans-serif;
    background: #eef2f5;
    color: #17212b;
}

main {
    max-width: 1000px;
    margin: auto;
}

h1 {
    text-align: center;
    font-size: 2.5rem;
    margin-bottom: 5px;
}

.subtitle {
    text-align: center;
    font-size: 1.3rem;
    margin-top: 0;
    margin-bottom: 25px;
}

button,
textarea,
select {
    font-family: inherit;
}

button {
    cursor: pointer;
}


/* =====================================
   ACCORDION
===================================== */

.accordion {
    margin-bottom: 18px;
    border-radius: 20px;
    overflow: hidden;
    background: white;
    box-shadow: 0 3px 10px rgba(0,0,0,0.08);
}

.accordion-toggle {
    width: 100%;
    min-height: 120px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    gap: 15px;
    padding: 22px;

    border: none;

    background: #087f8c;
    color: white;

    font-size: 1.55rem;
    font-weight: bold;

    text-align: left;
}

.accordion-toggle.open {
    background: #065f69;
}

.accordion-left {
    display: flex;
    align-items: center;
    gap: 18px;
}

.accordion-icon {
    font-size: 2.4rem;
}

.accordion-arrow {
    font-size: 2rem;
    transition: transform 0.2s ease;
}

.accordion-toggle.open .accordion-arrow {
    transform: rotate(180deg);
}

.accordion-content {
    display: none;
    padding: 20px;
    background: white;
}

.accordion-content.open {
    display: block;
}


/* =====================================
   JA / NEIN
===================================== */

.yes-no {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
}

.yes,
.no {
    min-height: 150px;

    border: none;
    border-radius: 20px;

    color: white;

    font-size: 2.5rem;
    font-weight: bold;
}

.yes {
    background: #198754;
}

.no {
    background: #c62828;
}


/* =====================================
   TEXT
===================================== */

textarea {
    width: 100%;
    min-height: 175px;

    padding: 18px;

    border: 3px solid #555;
    border-radius: 16px;

    font-size: 1.5rem;
}


/* =====================================
   BUTTONS
===================================== */

.big-button {
    width: 100%;
    min-height: 100px;

    margin-top: 16px;
    padding: 18px;

    border: none;
    border-radius: 16px;

    background: #0066cc;
    color: white;

    font-size: 1.5rem;
    font-weight: bold;
}

.action-grid {
    display: grid;

    grid-template-columns:
        repeat(auto-fit,minmax(200px,1fr));

    gap: 15px;
    margin-top: 15px;
}

.action-grid button {
    min-height: 85px;

    border: none;
    border-radius: 15px;

    background: #0066cc;
    color: white;

    font-size: 1.15rem;
    font-weight: bold;
}


/* =====================================
   PHRASE BUTTONS
===================================== */

.phrase-grid {
    display: grid;

    grid-template-columns:
        repeat(auto-fit,minmax(220px,1fr));

    gap: 16px;
}

.phrase-button {
    min-height: 105px;

    padding: 18px;

    border: none;
    border-radius: 16px;

    background: #5b3cc4;
    color: white;

    font-size: 1.2rem;
    font-weight: bold;
}


/* =====================================
   PHRASENVORSCHLÄGE
===================================== */

.topic-grid {
    display: grid;

    grid-template-columns:
        repeat(auto-fit,minmax(220px,1fr));

    gap: 18px;
}

.topic-button {
    min-height: 120px;

    padding: 20px;

    border: none;
    border-radius: 18px;

    background: #8b2fc9;
    color: white;

    font-size: 1.35rem;
    font-weight: bold;
}

.topic-button.active {
    outline: 6px solid #ffd400;
}

.suggestion-area {
    margin-top: 25px;
    padding-top: 20px;

    border-top: 3px solid #ddd;
}

.suggestion-heading {
    font-size: 1.4rem;
    margin-bottom: 15px;
}


/* =====================================
   STIMME
===================================== */

select {
    width: 100%;
    min-height: 75px;

    padding: 15px;

    font-size: 1.2rem;

    border: 3px solid #555;
    border-radius: 15px;

    background: white;
}


/* =====================================
   GESPEICHERTE SÄTZE
===================================== */

.saved-button {
    background: #7349c6;
}

.delete-button {
    width: 100%;
    min-height: 65px;

    margin-top: 8px;

    border: none;
    border-radius: 14px;

    background: #b71c1c;
    color: white;

    font-size: 1rem;
    font-weight: bold;
}


/* =====================================
   FOKUS / BLICKERFASSUNG
===================================== */

button:focus-visible,
textarea:focus-visible,
select:focus-visible {

    outline: 7px solid #ffd400;
    outline-offset: 5px;
}


/* =====================================
   STATUS
===================================== */

#status {
    padding: 15px;
    margin-top: 15px;

    font-size: 1.1rem;
    font-weight: bold;

    text-align: center;
}


/* =====================================
   IPHONE
===================================== */

@media(max-width:650px) {

    body {
        padding: 8px;
    }

    h1 {
        font-size: 2rem;
    }

    .accordion-toggle {
        min-height: 125px;

    }

    }

    }

    .yes,

        min-height: 135px;
        font-size: 2.2rem;
    }

    .topic-button {
        min-height: 120px;
        font-size: 1.4rem;
    }

}

</style>

<script>

/* =====================================
   ELEMENTE
===================================== */

const textField =
    document.getElementById("speechText");

const voiceSelect =
    document.getElementById("voiceSelect");

const status =
    document.getElementById("status");

const phraseSuggestions =
    document.getElementById("phraseSuggestions");

const suggestionHeading =
    document.getElementById("suggestionHeading");

let voices = [];


/* =====================================
   GEÖFFNETEN BEREICH ZENTRIEREN
===================================== */

function centerSection(section) {

    setTimeout(function() {

        section.scrollIntoView({
            behavior: "smooth",
            block: "center"
        });

    }, 180);

}


/* =====================================
   ACCORDION
===================================== */

document
.querySelectorAll(".accordion-toggle")
.forEach(function(button) {

    button.addEventListener(
        "click",
        function() {

            const target =
                document.getElementById(
                    button.dataset.target
                );

            const section =
                button.closest(".accordion");

            const alreadyOpen =
                target.classList.contains("open");


            document
            .querySelectorAll(".accordion-content")
            .forEach(function(content) {

                content.classList.remove("open");

            });


            document
            .querySelectorAll(".accordion-toggle")
            .forEach(function(toggle) {

                toggle.classList.remove("open");

                toggle.setAttribute(
                    "aria-expanded",
                    "false"
                );

            });


            if(!alreadyOpen) {

                target.classList.add("open");

                button.classList.add("open");

                button.setAttribute(
                    "aria-expanded",
                    "true"
                );

                centerSection(section);

            }

        }
    );

});


/* =====================================
   STIMMEN
===================================== */

function loadVoices() {

    voices =
        window.speechSynthesis.getVoices();

    voiceSelect.innerHTML = "";


    if(voices.length === 0) {

        const option =
            document.createElement("option");

        option.textContent =
            "Noch keine Stimmen verfügbar";

        voiceSelect.appendChild(option);

        return;

    }


    voices.forEach(function(voice) {

        const option =
            document.createElement("option");

        option.value =
            voice.voiceURI;

        option.textContent =
            voice.name +
            " – " +
            voice.lang;

        voiceSelect.appendChild(option);

    });


    const savedVoice =
        localStorage.getItem(
            "tongueboxVoice"
        );


    if(savedVoice) {

        voiceSelect.value =
            savedVoice;

    }

}


window.speechSynthesis.onvoiceschanged =
    loadVoices;

loadVoices();

setTimeout(loadVoices,500);
setTimeout(loadVoices,1500);


voiceSelect.addEventListener(
"change",
function() {

    localStorage.setItem(
        "tongueboxVoice",
        voiceSelect.value
    );

});


/* =====================================
   SPRECHEN
===================================== */

function speak(text) {

    if(!text || !text.trim()) {

        status.textContent =
            "Bitte zuerst Text eingeben.";

        return;

    }


    window.speechSynthesis.cancel();


    const utterance =
        new SpeechSynthesisUtterance(text);


    const selectedVoice =
        voices.find(function(voice) {

            return (
                voice.voiceURI ===
                voiceSelect.value
            );

        });


    if(selectedVoice) {

        utterance.voice =
            selectedVoice;

        utterance.lang =
            selectedVoice.lang;

    }


    window.speechSynthesis.speak(
        utterance
    );


    status.textContent =
        "🔊 Tonguebox spricht.";

}


/* =====================================
   PHRASEN-DATEN
===================================== */

const phraseTopics = {

    kaffee: {
        title: "☕ Kaffee",
        phrases: [
            "Ich möchte einen Kaffee.",
            "Bitte mit Milch.",
            "Bitte ohne Milch.",
            "Bitte mit Zucker.",
            "Bitte ohne Zucker.",
            "Noch einen Kaffee bitte.",
            "Der Kaffee ist zu heiß.",
            "Der Kaffee ist zu kalt."
        ]
    },

    trinken: {
        title: "🥤 Trinken",
        phrases: [
            "Ich möchte etwas trinken.",
            "Ich habe Durst.",
            "Ich möchte Wasser.",
            "Ich möchte einen Saft.",
            "Ich möchte einen Tee.",
            "Bitte noch etwas zu trinken.",
            "Nein danke, ich habe genug."
        ]
    },

    essen: {
        title: "🍽️ Essen",
        phrases: [
            "Ich möchte etwas essen.",
            "Ich habe Hunger.",
            "Was gibt es zu essen?",
            "Bitte noch etwas.",
            "Das schmeckt gut.",
            "Nein danke.",
            "Ich bin fertig."
        ]
    },

    schmerzen: {
        title: "🏥 Schmerzen",
        phrases: [
            "Ich habe Schmerzen.",
            "Die Schmerzen sind stark.",
            "Die Schmerzen sind leicht.",
            "Bitte helfen Sie mir.",
            "Bitte fragen Sie mich, wo es weh tut.",
            "Ich brauche eine Pause."
        ]
    },

    toilette: {
        title: "🚻 WC",
        phrases: [
            "Ich muss auf die Toilette.",
            "Bitte helfen Sie mir zur Toilette.",
            "Ich brauche Hilfe beim WC.",
            "Wo ist die Toilette?",
            "Bitte warten Sie einen Moment."
        ]
    },

    hilfe: {
        title: "🆘 Hilfe",
        phrases: [
            "Ich brauche Hilfe.",
            "Kannst du mir bitte helfen?",
            "Bitte komm zu mir.",
            "Ich brauche Unterstützung.",
            "Bitte warten Sie einen Moment."
        ]
    },

    telefon: {
        title: "📞 Telefon",
        phrases: [
            "Ich möchte telefonieren.",
            "Ich kommuniziere über eine Sprachausgabe.",
            "Bitte warten Sie, während ich meine Antwort schreibe.",
            "Bitte sprechen Sie langsamer.",
            "Bitte wiederholen Sie das.",
            "Danke für Ihre Geduld."
        ]
    },

    rollstuhl: {
        title: "♿ Rollstuhl",
        phrases: [
            "Ich brauche meinen Rollstuhl.",
            "Bitte stellen Sie meinen Rollstuhl näher.",
            "Bitte helfen Sie mir beim Rollstuhl.",
            "Ich möchte mit dem Rollstuhl fahren.",
            "Bitte ändern Sie meine Position."
        ]
    },

    ruhe: {
        title: "😴 Ruhe",
        phrases: [
            "Ich bin müde.",
            "Ich brauche eine Pause.",
            "Ich möchte mich ausruhen.",
            "Bitte lassen Sie mich kurz in Ruhe.",
            "Ich möchte schlafen."
        ]
    },

    medikamente: {
        title: "💊 Medikamente",
        phrases: [
            "Ich brauche meine Medikamente.",
            "Wann bekomme ich meine Medikamente?",
            "Bitte erklären Sie mir dieses Medikament.",
            "Habe ich meine Medikamente schon bekommen?",
            "Bitte warten Sie einen Moment."
        ]
    }

};


/* =====================================
   THEMA AUSWÄHLEN
===================================== */

document
.querySelectorAll(".topic-button")
.forEach(function(button) {

    button.addEventListener(
        "click",
        function() {

            document
            .querySelectorAll(".topic-button")
            .forEach(function(item) {

                item.classList.remove("active");

            });


            button.classList.add("active");


            const topicName =
                button.dataset.topic;


            showPhraseSuggestions(
                topicName
            );

        }
    );

});


/* =====================================
   PHRASEN ANZEIGEN
===================================== */

function showPhraseSuggestions(topicName) {

    const topic =
        phraseTopics[topicName];


    if(!topic) {
        return;
    }


    suggestionHeading.textContent =
        topic.title +
        " – passende Sätze";


    phraseSuggestions.innerHTML = "";


    topic.phrases.forEach(
    function(sentence) {

        const button =
            document.createElement("button");


        button.type =
            "button";

        button.className =
            "phrase-button";

        button.textContent =
            sentence;


        button.addEventListener(
            "click",
            function() {

                speak(sentence);

            }
        );


        phraseSuggestions.appendChild(
            button
        );

    });


    setTimeout(function() {

        suggestionHeading.scrollIntoView({
            behavior: "smooth",
            block: "center"
        });

    },120);

}

   TEXT VORLESEN
===================================== */

document
.getElementById("speakButton")
.addEventListener(

    speak(
        textField.value
    );

.getElementById("stopButton")

===================================== */

.getElementById("clearButton")

    textField.value = "";

/* =====================================
   SÄTZE SPEICHERN
===================================== */

function getSavedSentences() {

    try {

        return JSON.parse(

            localStorage.getItem(
                "tongueboxSentences"
            ) || "[]"

        );

    }

    catch(error) {

        return [];

    }

}


document
.getElementById("saveButton")
.addEventListener(
"click",
function() {

    const text =
        textField.value.trim();


    if(!text) {

        status.textContent =
            "Bitte zuerst einen Satz eingeben.";

        return;

    }


    const sentences =
        getSavedSentences();


    if(!sentences.includes(text)) {

        sentences.push(text);


        localStorage.setItem(
            "tongueboxSentences",
            JSON.stringify(sentences)
        );


        status.textContent =
            "💾 Satz gespeichert.";

    }

    else {

        status.textContent =
            "Dieser Satz ist bereits gespeichert.";

    }


    showSavedSentences();

});


/* =====================================
   GESPEICHERTE SÄTZE ANZEIGEN
===================================== */

function showSavedSentences() {

    const area =
        document.getElementById(
            "savedSentences"
        );


    area.innerHTML = "";


    const sentences =
        getSavedSentences();


    if(sentences.length === 0) {

        const info =
            document.createElement("p");


        info.textContent =
            "Noch keine eigenen Sätze gespeichert.";


        area.appendChild(info);

        return;

    }


    sentences.forEach(
    function(sentence,index) {

        const wrapper =
            document.createElement("div");


        const speakButton =
            document.createElement("button");


        speakButton.type =
            "button";

        speakButton.className =
            "phrase-button saved-button";

        speakButton.textContent =
            sentence;


        speakButton.addEventListener(
        "click",
        function() {

            speak(sentence);

        });


        const deleteButton =
            document.createElement("button");


        deleteButton.type =
            "button";

        deleteButton.className =
            "delete-button";

        deleteButton.textContent =
            "🗑 Löschen";


        deleteButton.addEventListener(
        "click",
        function() {

            const list =
                getSavedSentences();


            list.splice(
                index,
                1
            );


            localStorage.setItem(
                "tongueboxSentences",
                JSON.stringify(list)
            );


            showSavedSentences();

        });


        wrapper.appendChild(
            speakButton
        );

        wrapper.appendChild(
            deleteButton
        );


        area.appendChild(
            wrapper
        );

    });

}


/* =====================================
   START
===================================== */

showSavedSentences();

</script>
